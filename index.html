</main><dialog id="modal"><div id="modal-body"></div></dialog><script>window.P02_WEB={"apiUrl":"https://script.google.com/macros/s/AKfycby-w8l6me8DyQfZX5PXZDLk5PXUTVT-BY3xomKUANceDVHtCn_QrUrFfLp6pu7iZdF1tg/exec","version":"20261104.w2"};</script><script>(function(root){

<script>/* A single read/write transaction appends pending punches without tab races.

  open(name,initial){

      const req=indexedDB.open(name,1);

  const fix=await position();pending={id:M.id(),kind,at,createdAt:at,lat:fix?.lat??null,lon:fix?.lon??null,accuracy:fix?.accuracy??null,originalId:'',note:''};
  const last=M.effective(ownHistory()).at(-1),same=last?.kind===kind;
  modal(`<h2>${esc(kind)}を記録</h2><div class="confirm-name">${esc(data.session.employee.name)} さん</div><div class="punch-confirm">${M.time(at)}</div>${same?'<div class="error">直前も同じ種類の打刻です。打ち直しの場合は、履歴の「打刻を直す」をご利用ください。</div>':''}${kind==='退勤'?`<form id="punch-form" data-kind="退勤" data-at="${at}">${workFields(pending)}</form>`:''}<p>${fix?'打刻時の位置情報も保存します。':'位置情報を取得できなかったため「要確認」として記録します。'}</p><div id="dialog-error" class="error" hidden role="alert"></div>${closeButtons(kind==='退勤'?'この時間でOK':'この内容で記録','save-punch')}`);if(kind==='退勤')updateWorkForm($('punch-form'));
}
async function persistRecord(record){
  const s=data.session,q={employeeId:s.employee.id,name:s.employee.name,token:s.token,record};
  await save(current=>{if(current.session?.token!==s.token)throw Error('別の画面で登録が変わりました。再読み込みしてご確認ください。');return {...current,queue:current.queue.some(x=>x.record.id===record.id)?current.queue:[...current.queue,q]};});$('history-date').value=M.day(record.at);pending=null;dialog.close();busy=false;render();notify('端末に保存しました。保存先へ送信します。');flush();
}
function correct(id){const p=ownHistory().find(p=>p.id===id);if(!p)return;
  modal(`<h2>打刻・勤務時間の確認</h2><p>${M.day(p.at)} ／ ${esc(p.kind)}</p><form id="correction-form" data-exclude="${esc(id)}" data-manual="${Number.isInteger(p.confirmedMinutes)?'true':'false'}"><label>打刻時刻<input class="correction-time" name="time" type="time" step="60" value="${M.time(p.at)}" required></label><details class="correction-options"><summary>日付・出勤／退勤・理由も変更する</summary><label>日付<input name="date" type="date" value="${M.day(p.at)}" required></label><label>出勤／退勤<select name="kind"><option ${p.kind==='出勤'?'selected':''}>出勤</option><option ${p.kind==='退勤'?'selected':''}>退勤</option></select></label><label>理由（任意）<input name="note" maxlength="200"></label></details>${workFields(p)}</form><div id="dialog-error" class="error" hidden role="alert"></div><div class="buttons"><button class="btn" data-close>戻る</button><button class="btn primary" data-correct-save="${esc(id)}">この内容でOK</button></div>`);updateWorkForm($('correction-form'));
}
async function saveCorrection(id){const f=$('correction-form'),work=readWorkForm(f);if(!work)return;const fields=Object.fromEntries(new FormData(f)),at=Date.parse(fields.date+'T'+fields.time+':00+09:00');if(!Number.isFinite(at))throw Error('正しい日時を入力してください。');
  await persistRecord({id:M.id(),kind:fields.kind,at,createdAt:Date.now(),originalId:id,note:fields.note.trim()||'本人による打刻・勤務時間の確認',lat:null,lon:null,accuracy:null,...work});
}
function settings(){const s=data.session;modal(`<h2>保存・アカウント</h2>${s?`<p>${esc(s.employee.name)} ／ ${esc(s.employee.id)}</p><p>未送信 ${data.queue.length}件</p><p>機種変更時は、新しいスマホで同じお名前とパスワードを入力してください。以前のスマホで新たに押した打刻は受け付けません。</p><p>端末内の履歴表示は最近の記録です。長期の原本はスプレッドシートに保持します。</p><h3>ホーム画面のアイコン</h3>${WEB?(standalone?'<p>いまはホーム画面のアイコンから開いています。</p>':'<p>共有ボタン（□に↑のマーク）またはメニューから「ホーム画面に追加」を選ぶと、アプリのように使えます。iPhoneでは、追加したアイコンから最初に開いたときだけ、もう一度ログインしてください。</p>'):standalone?'<p>いまはアイコンから開いています。</p>':(iconUrl()?`<p>下のボタンで、このスマホ専用のページを開き直します。開いたページで「ホーム画面に追加」すると、次からアイコンで開いてもログインしたままになります。Chromeでログインし直しても、このアイコンはそのまま使えます。</p><a class="btn full" id="icon-link" target="_top" href="${esc(iconUrl())}">ホーム画面用のページを開く</a>`:'<p>ホーム画面用のページを作るには、まずこの画面でログインを確認してください（通信が必要です）。</p>')}${WEB?'':'<p class="fine-print">機種変更したときは、アイコンを作り直してください。アイコンのURLは他の人に送らないでください。</p>'}${!verified?'<button class="btn" data-action="relogin">再ログイン</button>':''}<button class="btn" data-action="logout">このスマホからログアウト</button>`:'<p>お名前とパスワードで登録してください。</p>'}<p class="fine-print">画面の版 ${CLIENT_VERSION}${boot.version?' ／ 保存先 '+esc(boot.version):''}</p><div class="buttons"><button class="btn primary" data-close>閉じる</button></div>`);}
document.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.authMode){authMode=b.dataset.authMode;render();}
  if(b.dataset.punch)preparePunch(b.dataset.punch).catch(err=>{busy=false;render();notify(err.message,true);});
  if(b.id==='settings')settings();if(b.id==='sync')flush();if(b.dataset.close!==undefined)dialog.close();if(b.dataset.correct)correct(b.dataset.correct);
  try{
    if(b.dataset.action==='save-punch'&&pending){const work=pending.kind==='退勤'?readWorkForm($('punch-form')):{};if(work)await persistRecord({...pending,...work});}
    if(b.dataset.correctSave)await saveCorrection(b.dataset.correctSave);
    if(['logout','relogin'].includes(b.dataset.action)){if(data.queue.length&&b.dataset.action!=='relogin'){modal('<h2>未送信の記録があります</h2><p>先に送信するか、管理者に確認してください。記録を保護するため、ログアウトはまだ行いません。</p><div class="buttons"><button class="btn" data-close>戻る</button></div>');return;}if(data.session)$('login-name').value=data.session.employee.name;await save(current=>({...current,session:null,history:current.queue.length?current.history:[]}));verified=true;syncUrl();dialog.close();render();}
  }catch(err){const el=$('dialog-error');if(el){el.hidden=false;el.textContent=err.message;}else notify(err.message,true);}
});
$('auth-form').addEventListener('submit',authenticate);$('history-date').value=M.day(Date.now());$('history-date').addEventListener('change',render);
document.addEventListener('submit',async ev=>{if(!['punch-form','correction-form'].includes(ev.target.id))return;ev.preventDefault();try{if(ev.target.id==='punch-form'&&pending){const work=readWorkForm(ev.target);if(work)await persistRecord({...pending,...work});}else if(ev.target.id==='correction-form'){await saveCorrection(ev.target.dataset.exclude);}}catch(err){$('dialog-error').hidden=false;$('dialog-error').textContent=err.message;}});
document.addEventListener('input',ev=>{const form=ev.target.closest('form');if(!form||!['punch-form','correction-form'].includes(form.id))return;if(['confirmed_hours','confirmed_minutes'].includes(ev.target.name))form.dataset.manual='true';if(ev.target.name==='lunch_custom'){form.dataset.manual='false';updateWorkForm(form);}});
document.addEventListener('change',ev=>{const form=ev.target.closest('form');if(form&&['punch-form','correction-form'].includes(form.id)&&['lunch','time','date','kind'].includes(ev.target.name)){form.dataset.manual='false';updateWorkForm(form);}});
dialog.addEventListener('close',()=>{pending=null;busy=false;render();});
window.addEventListener('online',()=>{refresh();flush();});document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
setInterval(tick,15000);setInterval(()=>{if(!document.hidden)refresh();},60000);
/* 新しい版が出ていたら、入力中・未送信がないときに自動で切り替える */
let updating=false;
async function checkUpdate(){
  if(!WEB||updating||navigator.onLine===false)return;
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=(await r.json()).version;
    if(!v||v===CLIENT_VERSION)return;
    if(dialog.open||busy||sending||data.queue.some(q=>!q.error)){setTimeout(checkUpdate,30000);return;}
    /* 同じ版への切り替えは1回だけ（ページのキャッシュが古いままでも、読み込みを繰り返さない） */
    let tried='';try{tried=sessionStorage.getItem('tc-update-tried')||'';}catch(e){}
    if(tried===v)return;
    try{sessionStorage.setItem('tc-update-tried',v);}catch(e){}
    updating=true;notify('新しい版に切り替えています…');
    try{const reg=await navigator.serviceWorker?.getRegistration();await reg?.update();}catch(e){}
    location.replace(location.pathname+'?v='+encodeURIComponent(v));
  }catch(e){}
}
if(WEB){
  try{const q=new URLSearchParams(location.search);if(q.has('v')){q.delete('v');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''));}}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
  setInterval(()=>{if(!document.hidden)checkUpdate();},300000);
}
render();ready.then(restoreFromUrl).then(()=>render()).then(()=>request('hello')).then(requireOk).then(()=>{available=true;render();refresh();checkUpdate();}).catch(err=>{available=false;$('cloud-status').textContent=err.message;});
})();
</script></body></html>
