<script>/* A single read/write transaction appends pending punches without tab races.
   iPhoneではアプリの切り替えなどで保存の接続が閉じられることがあるため、

window.TCStore={
  open(name,initial){
    let db=null;
    const connect=()=>new Promise((resolve,reject)=>{
      const req=indexedDB.open(name,1);
      req.onupgradeneeded=()=>req.result.createObjectStore('state');
      req.onerror=()=>reject(Error('端末に保存できません。通常のブラウザで開き直してください。'));

      if(!db)await connect();

  }
};

/** 出勤の確認画面：始業の表示と、前回の退勤の時間の計算 */

async function saveCorrection(id){const f=$('correction-form'),work=readWorkForm(f);if(!work)return;const fields=Object.fromEntries(new FormData(f)),at=Date.parse(fields.date+'T'+fields.time+':00+09:00');if(!Number.isFinite(at))throw Error('正しい日時を入れてください。');if(isLocked(at))throw Error(LOCK_MSG);

async function saveDay(){const f=$('day-form');if(!f)return;const work=readWorkForm(f);if(!work)return;const date=f.elements.date?.value;
  if(f.dataset.mode==='new'){const at=Date.parse(date+'T'+f.elements.time.value+':00+09:00');if(!Number.isFinite(at))throw Error('退勤した時刻を入れてください。');if(at>Date.now())throw Error('これからの時刻は入れられません。');if(isLocked(at))throw Error(LOCK_MSG);

async function checkUpdate(){

    let tried='';try{tried=sessionStorage.getItem('tc-update-tried')||'';}catch(e){}
    if(tried===v)return;
    try{sessionStorage.setItem('tc-update-tried',v);}catch(e){}
    updating=true;notify('新しい版に切り替えています…');
    try{const reg=await navigator.serviceWorker?.getRegistration();await reg?.update();}catch(e){}
    location.replace(location.pathname+'?v='+encodeURIComponent(v));
  }catch(e){}
}

  try{const q=new URLSearchParams(location.search);if(q.has('v')){q.delete('v');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''));}}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

}
